modLoader="javafml"
loaderVersion="[2,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="EnchantMaster"
description='''
Enchant Master - forge custom enchanted items with attributes, names, and lore.

Server-only friendly: put the JAR on the dedicated server for the web UI (ops toggle it with /enchantmaster web start|stop). Players without this mod can still join.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
