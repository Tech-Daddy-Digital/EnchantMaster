name: Release

# Creates a GitHub Release when you push a version tag (v1.0.5).
# Uploads any enchantmaster jars already present in dist/matrix/ on that commit.
# For CI-built jars, add a build matrix job before the upload step.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect release jars
        id: jars
        run: |
          mkdir -p dist/matrix
          shopt -s nullglob
          files=(dist/matrix/enchantmaster-*.jar)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No jars in dist/matrix — release will have no assets."
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found ${#files[@]} jar(s)"
            ls -la dist/matrix/enchantmaster-*.jar
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          NOTES_FILE=release-notes.md
          if [ -f CHANGELOG.md ]; then
            # Grab section for this version if present; else whole changelog head
            awk -v ver="$VER" '
              $0 ~ "^## \\[" ver "\\]" {p=1; print; next}
              p && $0 ~ /^## \[/ {exit}
              p {print}
            ' CHANGELOG.md > "$NOTES_FILE" || true
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Enchant Master ${TAG}" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "See CHANGELOG.md and the project wiki for install notes." >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "Download the jar matching your Minecraft version and loader (Forge vs NeoForge)." >> "$NOTES_FILE"
          fi
          cat "$NOTES_FILE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Enchant Master ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/matrix/enchantmaster-*.jar
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
